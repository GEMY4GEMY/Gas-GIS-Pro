name: QGIS runtime smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gasgis/**'
      - 'tests/**'
      - '.github/workflows/qgis-smoke.yml'
jobs:
  qgis-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution PyQGIS and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-qgis python3-pyqt5 xvfb
      - name: Compile sources using system Python
        run: /usr/bin/python3 -m compileall -q gasgis
      - name: Import PyQGIS modules and instantiate desktop window
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from qgis.core import QgsApplication
          app = QgsApplication([], True)
          app.initQgis()
          from qgis.core import QgsVectorLayer, QgsFeature, QgsGeometry, QgsPointXY
          from gasgis.geometry_adapter import line_parts, line_segments
          from gasgis.unified_audit import audit_network
          layer = QgsVectorLayer('LineString?crs=EPSG:32636', 'pipes', 'memory')
          assert layer.isValid()
          feature = QgsFeature(layer.fields())
          feature.setGeometry(QgsGeometry.fromPolylineXY([QgsPointXY(0, 0), QgsPointXY(1, 0), QgsPointXY(2, 0)]))
          assert layer.dataProvider().addFeatures([feature])[0]
          assert len(line_parts(layer)) == 1
          assert len(line_segments(layer)) == 2
          assert len(audit_network(line_parts(layer), line_segments(layer))) == 2
          from gasgis.main import MainWindow
          window = MainWindow()
          assert window.windowTitle().startswith('Gas GIS Pro')
          assert window.layer_tree.topLevelItemCount() == 0
          from qgis.core import QgsProject
          QgsProject.instance().addMapLayer(layer)
          window.refresh_layers()
          assert window.layer_tree.topLevelItemCount() >= 1
          from qgis.PyQt.QtCore import Qt
          item = next(window.layer_tree.topLevelItem(i) for i in range(window.layer_tree.topLevelItemCount()) if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == layer.id())
          item.setCheckState(0, Qt.Unchecked)
          assert not QgsProject.instance().layerTreeRoot().findLayer(layer.id()).itemVisibilityChecked()
          from qgis.core import QgsVectorFileWriter
          with tempfile.TemporaryDirectory() as tmp:
              gpkg = Path(tmp) / 'pipes.gpkg'
              options = QgsVectorFileWriter.SaveVectorOptions()
              options.driverName = 'GPKG'
              options.layerName = 'pipes'
              result = QgsVectorFileWriter.writeAsVectorFormatV3(
                  layer, str(gpkg), QgsProject.instance().transformContext(), options
              )
              assert result[0] == QgsVectorFileWriter.NoError
              QgsProject.instance().removeMapLayer(layer.id())
              persisted = QgsVectorLayer(str(gpkg) + '|layername=pipes', 'pipes', 'ogr')
              assert persisted.isValid()
              QgsProject.instance().addMapLayer(persisted)
              window.refresh_layers()
              persisted_item = next(window.layer_tree.topLevelItem(i) for i in range(window.layer_tree.topLevelItemCount()) if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == persisted.id())
              persisted_item.setCheckState(0, Qt.Unchecked)
              project_file = Path(tmp) / 'visibility.qgz'
              project = QgsProject.instance()
              project.setFileName(str(project_file))
              assert project.write()
              assert project.read(str(project_file))
              restored = project.mapLayersByName('pipes')
              assert len(restored) == 1
              assert not project.layerTreeRoot().findLayer(restored[0].id()).itemVisibilityChecked()
              window.layer_visibility.clear()
              window.refresh_layers()
              assert window.layer_tree.topLevelItemCount() >= 1
              project.clear()
              window.refresh_layers()
          from gasgis.asset_layers import create_asset_layer
          with tempfile.TemporaryDirectory() as tmp:
              gpkg = Path(tmp) / 'gas.gpkg'
              saved = create_asset_layer(gpkg, 'gas_mains', 'EPSG:32636')
              assert gpkg.is_file() and saved.isValid()
          from qgis.PyQt.QtWidgets import QMessageBox
          test_layer = QgsVectorLayer('Point?crs=EPSG:32636', 'editing_test', 'memory')
          QgsProject.instance().addMapLayer(test_layer)
          assert test_layer.startEditing()
          assert window.active_edit_layers() == ['editing_test']
          assert test_layer.rollBack()
          assert window.active_edit_layers() == []
          window.close()
          QgsProject.instance().clear()
          del window
          print("QGIS desktop smoke test passed")
          # Process exit releases Qt/QGIS after the Python objects are gone.
          PY
