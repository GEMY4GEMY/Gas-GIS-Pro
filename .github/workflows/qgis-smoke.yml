name: QGIS runtime smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gasgis/**'
      - 'tests/**'
      - '.github/workflows/qgis-smoke.yml'
jobs:
  qgis-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution PyQGIS and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-qgis python3-pyqt5 xvfb
      - name: Compile sources using system Python
        run: /usr/bin/python3 -m compileall -q gasgis
      - name: Import PyQGIS modules and instantiate desktop window
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from qgis.core import QgsApplication
          app = QgsApplication([], True)
          app.initQgis()
          from qgis.core import QgsVectorLayer, QgsFeature, QgsGeometry, QgsPointXY, QgsProject
          from gasgis.geometry_adapter import line_parts, line_segments
          from gasgis.unified_audit import audit_network
          layer = QgsVectorLayer('LineString?crs=EPSG:32636', 'pipes', 'memory')
          assert layer.isValid()
          feature = QgsFeature(layer.fields())
          feature.setGeometry(QgsGeometry.fromPolylineXY([QgsPointXY(0, 0), QgsPointXY(1, 0), QgsPointXY(2, 0)]))
          assert layer.dataProvider().addFeatures([feature])[0]
          assert len(line_parts(layer)) == 1
          assert len(line_segments(layer)) == 2
          from qgis.core import QgsField
          from qgis.PyQt.QtCore import QVariant
          layer.dataProvider().addAttributes([QgsField('diameter_mm', QVariant.Int)])
          layer.updateFields()
          stored_feature_id = next(layer.getFeatures()).id()
          assert layer.dataProvider().changeAttributeValues({stored_feature_id: {0: 63}})
          assert next(layer.getFeatures())['diameter_mm'] == 63
          assert len(audit_network(line_parts(layer), line_segments(layer))) == 2
          from gasgis.service_layer_adapter import service_proposals
          riser_points = QgsVectorLayer('Point?crs=EPSG:32636', 'service_test_risers', 'memory')
          riser_feature = QgsFeature(riser_points.fields())
          riser_feature.setGeometry(QgsGeometry.fromPointXY(QgsPointXY(1, 4)))
          assert riser_points.dataProvider().addFeatures([riser_feature])[0]
          proposed = service_proposals(riser_points, layer)
          assert len(proposed) == 1
          assert proposed[0]['within_limit']
          assert abs(proposed[0]['distance_m'] - 4.0) < 0.001
          assert proposed[0]['main_point'] == (1.0, 0.0)
          from gasgis.main import MainWindow
          preview_window = MainWindow()
          preview_mains = QgsVectorLayer('LineString?crs=EPSG:32636', 'gas_mains', 'memory')
          assert preview_mains.dataProvider().addFeatures(list(layer.getFeatures()))[0]
          riser_points.setName('gas_risers')
          QgsProject.instance().addMapLayer(preview_mains)
          QgsProject.instance().addMapLayer(riser_points)
          preview_window.preview_service_connections()
          preview_layers = QgsProject.instance().mapLayersByName('service_preview')
          assert len(preview_layers) == 1
          assert preview_layers[0].featureCount() == 1
          assert abs(next(preview_layers[0].getFeatures())['length_m'] - 4.0) < 0.001
          assert next(preview_layers[0].getFeatures())['review'] == 'WITHIN_LIMIT'
          assert len(preview_layers[0].renderer().rootRule().children()) == 2
          for temporary_layer in [preview_layers[0], preview_mains, riser_points]:
              QgsProject.instance().removeMapLayer(temporary_layer.id())
          preview_window.close()
          del preview_window
          from gasgis.main import MainWindow
          window = MainWindow()
          assert window.windowTitle().startswith('Gas GIS Pro')
          assert window.layer_tree.topLevelItemCount() == 0
          from unittest.mock import patch
          from qgis.PyQt.QtWidgets import QInputDialog, QFileDialog
          from qgis.PyQt.QtCore import Qt
          with tempfile.TemporaryDirectory() as tmp:
              ui_gpkg = Path(tmp) / 'ui_layers.gpkg'
              with patch.object(QInputDialog, 'getItem', side_effect=[
                  ('gas_mains', True), ('Create new GeoPackage', True),
                  ('gas_services', True), ('Add to existing GeoPackage', True)
              ]), patch.object(QInputDialog, 'getText', side_effect=[
                  ('EPSG:32636', True), ('EPSG:32636', True)
              ]), patch.object(QFileDialog, 'getSaveFileName', return_value=(str(ui_gpkg), '')), patch.object(
                  QFileDialog, 'getOpenFileName', return_value=(str(ui_gpkg), '')
              ):
                  window.new_gas_layer()
                  window.new_gas_layer()
              assert len(QgsProject.instance().mapLayersByName('gas_mains')) == 1
              assert len(QgsProject.instance().mapLayersByName('gas_services')) == 1
              created_mains = QgsProject.instance().mapLayersByName('gas_mains')[0]
              created_services = QgsProject.instance().mapLayersByName('gas_services')[0]
              assert created_mains.renderer().symbol().color().name() == '#c0392b'
              assert abs(created_mains.renderer().symbol().width() - 0.9) < 0.001
              assert created_services.renderer().symbol().color().name() == '#e67e22'
              assert abs(created_services.renderer().symbol().width() - 0.5) < 0.001
              QgsProject.instance().clear()
              window.refresh_layers()

          QgsProject.instance().addMapLayer(layer)
          window.refresh_layers()
          assert window.layer_tree.topLevelItemCount() >= 1
          window.zoom_to_selected_layer()
          assert 'Select a layer first' in window.statusBar().currentMessage()
          window.layer_tree.setCurrentItem(window.layer_tree.topLevelItem(0))
          with patch('gasgis.main.QInputDialog.getItem', side_effect=[('diameter_mm', True), ('=', True)]), patch(
              'gasgis.main.QInputDialog.getText', return_value=('63', True)
          ):
              window.select_by_attribute()
          assert layer.selectedFeatureCount() == 1
          reference_layer = QgsVectorLayer('Point?crs=EPSG:32636', 'reference_points', 'memory')
          reference_feature = QgsFeature(reference_layer.fields())
          reference_feature.setGeometry(QgsGeometry.fromPointXY(QgsPointXY(1, 0)))
          assert reference_layer.dataProvider().addFeatures([reference_feature])[0]
          QgsProject.instance().addMapLayer(reference_layer)
          window.refresh_layers()
          window.layer_tree.setCurrentItem(next(
              window.layer_tree.topLevelItem(i)
              for i in range(window.layer_tree.topLevelItemCount())
              if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == layer.id()
          ))
          with patch('gasgis.main.QInputDialog.getItem', side_effect=[
              (f'{reference_layer.name()} [{reference_layer.id()}]', True),
              ('Intersects', True)
          ]):
              window.select_by_location()
          assert layer.selectedFeatureCount() == 1
          with patch('gasgis.main.QInputDialog.getItem', side_effect=[
              (f'{reference_layer.name()} [{reference_layer.id()}]', True),
              ('Within distance (meters)', True)
          ]), patch('gasgis.main.QInputDialog.getDouble', return_value=(0.5, True)):
              window.select_by_location()
          assert layer.selectedFeatureCount() == 1
          with patch('gasgis.main.QInputDialog.getItem', side_effect=[
              (f'{reference_layer.name()} [{reference_layer.id()}]', True),
              ('Within distance (meters)', True)
          ]), patch('gasgis.main.QInputDialog.getDouble', return_value=(0.5, True)):
              window.select_by_location()
          assert layer.selectedFeatureCount() == 1
          far_reference = QgsVectorLayer('Point?crs=EPSG:32636', 'far_reference', 'memory')
          far_feature = QgsFeature(far_reference.fields())
          far_feature.setGeometry(QgsGeometry.fromPointXY(QgsPointXY(100, 100)))
          assert far_reference.dataProvider().addFeatures([far_feature])[0]
          QgsProject.instance().addMapLayer(far_reference)
          with patch('gasgis.main.QInputDialog.getItem', side_effect=[
              (f'{far_reference.name()} [{far_reference.id()}]', True),
              ('Within distance (meters)', True)
          ]), patch('gasgis.main.QInputDialog.getDouble', return_value=(0.5, True)):
              window.select_by_location()
          assert layer.selectedFeatureCount() == 0
          window.zoom_to_selected_layer()
          from qgis.PyQt.QtCore import Qt
          item = next(window.layer_tree.topLevelItem(i) for i in range(window.layer_tree.topLevelItemCount()) if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == layer.id())
          item.setCheckState(0, Qt.Unchecked)
          assert not QgsProject.instance().layerTreeRoot().findLayer(layer.id()).itemVisibilityChecked()
          from qgis.core import QgsVectorFileWriter
          with tempfile.TemporaryDirectory() as tmp:
              gpkg = Path(tmp) / 'pipes.gpkg'
              options = QgsVectorFileWriter.SaveVectorOptions()
              options.driverName = 'GPKG'
              options.layerName = 'pipes'
              result = QgsVectorFileWriter.writeAsVectorFormatV3(
                  layer, str(gpkg), QgsProject.instance().transformContext(), options
              )
              assert result[0] == QgsVectorFileWriter.NoError
              QgsProject.instance().removeMapLayer(layer.id())
              persisted = QgsVectorLayer(str(gpkg) + '|layername=pipes', 'pipes', 'ogr')
              assert persisted.isValid()
              QgsProject.instance().addMapLayer(persisted)
              window.refresh_layers()
              persisted_item = next(window.layer_tree.topLevelItem(i) for i in range(window.layer_tree.topLevelItemCount()) if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == persisted.id())
              persisted_item.setCheckState(0, Qt.Unchecked)
              from qgis.core import QgsLineSymbol
              persisted.renderer().setSymbol(QgsLineSymbol.createSimple({
                  'line_color': '#2475bb', 'line_width': '1.8'
              }))
              persisted.triggerRepaint()
              project_file = Path(tmp) / 'visibility.qgz'
              project = QgsProject.instance()
              project.setFileName(str(project_file))
              assert project.write()
              assert project.read(str(project_file))
              restored = project.mapLayersByName('pipes')
              assert len(restored) == 1
              assert not project.layerTreeRoot().findLayer(restored[0].id()).itemVisibilityChecked()
              restored_symbol = restored[0].renderer().symbol()
              assert restored_symbol.color().name() == '#2475bb'
              assert abs(restored_symbol.width() - 1.8) < 0.01
              window.layer_visibility.clear()
              window.refresh_layers()
              assert window.layer_tree.topLevelItemCount() >= 1
              project.clear()
              window.refresh_layers()
          from gasgis.asset_layers import create_asset_layer, append_asset_layer
          with tempfile.TemporaryDirectory() as tmp:
              gpkg = Path(tmp) / 'gas.gpkg'
              saved = create_asset_layer(gpkg, 'gas_mains', 'EPSG:32636')
              assert gpkg.is_file() and saved.isValid()
              services = append_asset_layer(gpkg, 'gas_services', 'EPSG:32636')
              valves = append_asset_layer(gpkg, 'gas_valves', 'EPSG:32636')
              risers = append_asset_layer(gpkg, 'gas_risers', 'EPSG:32636')
              assert all(layer.isValid() for layer in (services, valves, risers))
              try:
                  append_asset_layer(gpkg, 'gas_mains', 'EPSG:32636')
              except FileExistsError:
                  pass
              else:
                  raise AssertionError('Duplicate gas asset layer must be rejected')
              import sqlite3
              with sqlite3.connect(gpkg) as db:
                  names = {row[0] for row in db.execute('SELECT table_name FROM gpkg_contents')}
              assert {'gas_mains', 'gas_services', 'gas_valves', 'gas_risers'} <= names
              from gasgis.geopackage_catalog import geopackage_vector_tables
              assert set(geopackage_vector_tables(gpkg)) == {
                  'gas_mains', 'gas_services', 'gas_valves', 'gas_risers'
              }
              saved = services = valves = risers = None
              QgsProject.instance().clear()
              window.refresh_layers()
              with patch.object(QFileDialog, 'getOpenFileName', return_value=(str(gpkg), '')), patch.object(
                  QInputDialog, 'getItem', return_value=('gas_mains', True)
              ):
                  window.open_layer()
              assert len(QgsProject.instance().mapLayersByName('gas_mains')) == 1
              assert len(QgsProject.instance().mapLayers()) == 1
              QgsProject.instance().clear()
              window.refresh_layers()
              with patch.object(QFileDialog, 'getOpenFileName', return_value=(str(gpkg), '')), patch.object(
                  QInputDialog, 'getItem', return_value=('All layers', True)
              ):
                  window.open_layer()
              assert len(QgsProject.instance().mapLayers()) == 4
              assert window.layer_tree.topLevelItemCount() == 4
              with patch.object(QFileDialog, 'getOpenFileName', return_value=(str(gpkg), '')), patch.object(
                  QInputDialog, 'getItem', return_value=('All layers', True)
              ):
                  window.open_layer()
              assert len(QgsProject.instance().mapLayers()) == 4, 'Reopening must not duplicate layers'
              QgsProject.instance().clear()
              window.refresh_layers()
              try:
                  create_asset_layer(Path(tmp) / 'feet.gpkg', 'gas_mains', 'EPSG:2263')
              except ValueError:
                  pass
              else:
                  raise AssertionError('Feet-based CRS must be rejected')
              fake = Path(tmp) / 'not_a_gpkg.gpkg'
              with sqlite3.connect(fake) as db:
                  db.execute('CREATE TABLE dummy (id INTEGER)')
              try:
                  append_asset_layer(fake, 'gas_mains', 'EPSG:32636')
              except ValueError:
                  pass
              else:
                  raise AssertionError('Ordinary SQLite file must be rejected')
              relative_name = 'relative_gas.gpkg'
              import os
              original_cwd = os.getcwd()
              try:
                  os.chdir(tmp)
                  relative_saved = create_asset_layer(relative_name, 'gas_mains', 'EPSG:32636')
                  assert relative_saved.isValid()
                  relative_services = append_asset_layer(relative_name, 'gas_services', 'EPSG:32636')
                  assert relative_services.isValid()
                  relative_saved = relative_services = None
              finally:
                  os.chdir(original_cwd)
          from qgis.PyQt.QtWidgets import QMessageBox
          removal_layer = QgsVectorLayer('Point?crs=EPSG:32636', 'remove_test', 'memory')
          QgsProject.instance().addMapLayer(removal_layer)
          window.refresh_layers()
          from qgis.PyQt.QtCore import Qt
          removal_item = next(
              window.layer_tree.topLevelItem(i)
              for i in range(window.layer_tree.topLevelItemCount())
              if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == removal_layer.id()
          )
          window.layer_tree.setCurrentItem(removal_item)
          with patch('gasgis.main.QInputDialog.getText', return_value=('Renamed gas layer', True)):
              window.rename_selected_layer()
          assert removal_layer.name() == 'Renamed gas layer'
          with patch('gasgis.main.QInputDialog.getText', return_value=('  ', True)), patch(
              'gasgis.main.QMessageBox.warning'
          ) as invalid_name_warning:
              window.rename_selected_layer()
              invalid_name_warning.assert_called_once()
          assert removal_layer.name() == 'Renamed gas layer'
          from qgis.PyQt.QtGui import QColor
          with patch('gasgis.main.QColorDialog.getColor', return_value=QColor('#1769aa')):
              window.set_selected_layer_color()
          assert removal_layer.renderer().symbol().color().name() == '#1769aa'
          with patch('gasgis.main.QInputDialog.getDouble', return_value=(4.5, True)):
              window.set_selected_symbol_size()
          assert abs(removal_layer.renderer().symbol().size() - 4.5) < 0.001
          line_style_layer = QgsVectorLayer('LineString?crs=EPSG:32636', 'styled_mains', 'memory')
          QgsProject.instance().addMapLayer(line_style_layer)
          window.refresh_layers()
          line_item = next(
              window.layer_tree.topLevelItem(i)
              for i in range(window.layer_tree.topLevelItemCount())
              if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == line_style_layer.id()
          )
          window.layer_tree.setCurrentItem(line_item)
          with patch('gasgis.main.QColorDialog.getColor', return_value=QColor('#aa5522')):
              window.set_selected_layer_color()
          assert line_style_layer.renderer().symbol().color().name() == '#aa5522'
          with patch('gasgis.main.QInputDialog.getDouble', return_value=(1.7, True)):
              window.set_selected_symbol_size()
          assert abs(line_style_layer.renderer().symbol().width() - 1.7) < 0.001
          line_style_layer.setName('gas_mains')
          window.apply_gas_layer_style()
          assert line_style_layer.renderer().symbol().color().name() == '#c0392b'
          assert abs(line_style_layer.renderer().symbol().width() - 0.9) < 0.001
          line_style_layer.setName('gas_valves')
          with patch('gasgis.main.QMessageBox.warning') as mismatch_warning:
              window.apply_gas_layer_style()
              mismatch_warning.assert_called_once()
          assert line_style_layer.renderer().symbol().color().name() == '#c0392b'
          line_style_layer.setName('gas_mains')
          removal_layer.setName('gas_valves')
          window.style_all_gas_layers()
          assert line_style_layer.renderer().symbol().color().name() == '#c0392b'
          assert removal_layer.renderer().symbol().color().name() == '#2980b9'
          assert abs(removal_layer.renderer().symbol().size() - 3.5) < 0.001
          window.layer_tree.setCurrentItem(next(
              window.layer_tree.topLevelItem(i)
              for i in range(window.layer_tree.topLevelItemCount())
              if window.layer_tree.topLevelItem(i).data(0, Qt.UserRole) == removal_layer.id()
          ))
          assert removal_layer.startEditing()
          with patch('gasgis.main.QMessageBox.warning') as warning:
              window.remove_selected_layer()
              warning.assert_called_once()
          assert QgsProject.instance().mapLayer(removal_layer.id()) is not None
          assert removal_layer.rollBack()
          with patch('gasgis.main.QMessageBox.question', return_value=QMessageBox.No):
              window.remove_selected_layer()
          assert QgsProject.instance().mapLayer(removal_layer.id()) is not None
          removal_id = removal_layer.id()
          with patch('gasgis.main.QMessageBox.question', return_value=QMessageBox.Yes):
              window.remove_selected_layer()
          assert QgsProject.instance().mapLayer(removal_id) is None
          test_layer = QgsVectorLayer('Point?crs=EPSG:32636', 'editing_test', 'memory')
          QgsProject.instance().addMapLayer(test_layer)
          assert test_layer.startEditing()
          assert window.active_edit_layers() == ['editing_test']
          from unittest.mock import Mock
          with patch('gasgis.main.QMessageBox.warning') as warning:
              assert not window.confirm_close()
              blocked_event = Mock()
              window.closeEvent(blocked_event)
              blocked_event.ignore.assert_called_once()
              blocked_event.accept.assert_not_called()
              assert warning.call_count == 2
          assert test_layer.rollBack()
          assert window.active_edit_layers() == []
          assert window.confirm_close()
          allowed_event = Mock()
          window.closeEvent(allowed_event)
          allowed_event.accept.assert_called_once()
          allowed_event.ignore.assert_not_called()
          window.close()
          QgsProject.instance().clear()
          del window
          print("QGIS desktop smoke test passed")
          # Process exit releases Qt/QGIS after the Python objects are gone.
          PY
