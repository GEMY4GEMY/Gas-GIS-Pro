name: QGIS runtime smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gasgis/**'
      - 'tests/**'
      - '.github/workflows/qgis-smoke.yml'
jobs:
  qgis-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution PyQGIS and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-qgis python3-pyqt5 xvfb
      - name: Compile sources using system Python
        run: /usr/bin/python3 -m compileall -q gasgis
      - name: Import PyQGIS modules and instantiate desktop window
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          from qgis.core import QgsApplication
          app = QgsApplication([], True)
          app.initQgis()
          from qgis.core import QgsVectorLayer, QgsFeature, QgsGeometry, QgsPointXY
          from gasgis.geometry_adapter import line_parts, line_segments
          from gasgis.unified_audit import audit_network
          layer = QgsVectorLayer('LineString?crs=EPSG:32636', 'pipes', 'memory')
          assert layer.isValid()
          feature = QgsFeature(layer.fields())
          feature.setGeometry(QgsGeometry.fromPolylineXY([QgsPointXY(0, 0), QgsPointXY(1, 0), QgsPointXY(2, 0)]))
          assert layer.dataProvider().addFeatures([feature])[0]
          assert len(line_parts(layer)) == 1
          assert len(line_segments(layer)) == 2
          assert len(audit_network(line_parts(layer), line_segments(layer))) == 2
          from gasgis.main import MainWindow
          window = MainWindow()
          assert window.windowTitle().startswith("Gas GIS Pro")
          window.close()
          del window
          app.exitQgis()
          print("QGIS desktop smoke test passed")
          PY
